# ---------------------------------------------------------------------------
# agentmoat: release workflow
# ---------------------------------------------------------------------------
#
# Trigger:
#   * Pushed tags matching the semver pattern `v*.*.*` (e.g. v0.1.0, v1.2.3).
#     We deliberately only fire on three-segment semver tags so unrelated tags
#     (e.g. a future `nightly-2026-05-22`) do not accidentally cut a release.
#
# Job:
#   * `release`: runs GoReleaser on ubuntu-latest. GoReleaser reads
#     .goreleaser.yaml at the repo root, builds the two binaries
#     (agentmoat, agentmoat-mcp) for the configured OS / arch matrix,
#     produces tar.gz archives, a sha256 checksums file, and an auto-
#     generated changelog, then uploads everything to a GitHub Release
#     keyed off the pushed tag. It also builds the two container images
#     (default and -alpine, linux/amd64 + linux/arm64) and pushes them to
#     ghcr.io/0hardik1/agentmoat. See the `dockers_v2` block in
#     .goreleaser.yaml.
#
# Tokens:
#   * `GITHUB_TOKEN` (provided automatically by Actions) is sufficient for
#     uploading release assets to the same repo, and for pushing images to
#     GHCR under the same owner once the job has `packages: write`. No
#     Personal Access Token is necessary.
#   * A third-party registry such as Docker Hub would need its own secret
#     and a second login step.
#
# Checkout depth:
#   * `fetch-depth: 0` clones the full git history. GoReleaser needs every
#     reachable commit to build the changelog between the current tag and
#     the previous one; the default shallow clone would produce an empty or
#     incorrect changelog.
# ---------------------------------------------------------------------------

name: Release

# Fire only on three-part semver tags. Tags like `v0.1.0-rc.1` still match
# the glob because the `*` allows additional characters; goreleaser will
# treat them as prereleases per `prerelease: auto` in .goreleaser.yaml.
on:
  push:
    tags:
      - 'v*.*.*'

# `contents: write` is required so GoReleaser can create the GitHub Release
# and upload assets. `packages: write` lets the job push the container
# images to GHCR. Other scopes stay at their default (read or none).
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Full history clone: GoReleaser's changelog generator walks `git log`
      # from the previous tag to HEAD. A shallow clone would silently produce
      # an empty changelog. This is the #1 GoReleaser footgun.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Matches go.mod's `go` directive. Bump in lockstep with ci.yml.
          go-version: '1.26'
          cache: true

      # Buildx with the docker-container driver. GoReleaser's image step
      # runs one `docker buildx build` for linux/amd64 and linux/arm64 and
      # attaches an SBOM attestation; the default `docker` driver on the
      # runner can do neither. No QEMU step is needed: the Dockerfiles have
      # no RUN line, so nothing executes for the foreign architecture.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR as the workflow, so `docker buildx build --push` can
      # write ghcr.io/0hardik1/agentmoat. The password is the per-job
      # GITHUB_TOKEN; it works because of `packages: write` above.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action@v7 wraps the official goreleaser binary. `args` is
      # the literal command-line; `release --clean` is the standard release
      # invocation (build, archive, publish, and clean the dist/ dir first).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pin to a major. Minor / patch GoReleaser updates are usually
          # safe; majors can break config schema.
          version: '~> v2'
          args: release --clean
        env:
          # GITHUB_TOKEN is provisioned per-job by Actions and is scoped to
          # this repo. It is sufficient for creating a Release and uploading
          # assets. (The image push uses the GHCR login step above.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
