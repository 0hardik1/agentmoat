# ---------------------------------------------------------------------------
# agentmoat: weekly gVisor release drift check
# ---------------------------------------------------------------------------
#
# Why this exists:
#   The gVisor release is pinned in three files (see docs/gvisor-version.md).
#   gVisor ships a point release most weeks, and a sandbox runtime that is a
#   year behind undermines the whole premise of the tool. Nothing else in the
#   repo would notice: Dependabot cannot read a URL path fragment, and the
#   pin only fails loudly when a human rebuilds an image.
#
# What it does:
#   Runs scripts/check-gvisor-version.sh --latest. That script finds the
#   newest gVisor tag whose release tarball (gvisor.tar.bz2 + .sha512, for
#   x86_64 and aarch64) is in the release bucket and exits 2 when the pin is
#   behind it. A tag with no tarball is skipped with a warning annotation on
#   the run, so a skip can no longer pass unseen (four releases did, before
#   the check learned the tarball layout).
#
#   Drift is tracked in one open issue with the label `gvisor-drift`:
#     - pin behind, no open issue: open one, assigned to the repository
#       owner (the assignment sends the notification), with the new tag and
#       the bump commands;
#     - pin behind, issue open, newer release since: update the title and
#       body, and comment so the assignee is notified again;
#     - pin current, issue open: close it.
#   The run stays green in all three cases.
#
#   The run fails only on a real error: a network error, diverged pins, or a
#   missing tarball for the current pin. A red run always needs a look.
#
# Why drift is an issue and not a red run:
#   Until 2026-10 the run failed on drift. gVisor ships most weeks, so the
#   run was red most Mondays, and a red run reads as "the check is broken"
#   (the 2026-10-19 run was read that way). An issue is a to-do that stays
#   open until the pin catches up, and a red run keeps one meaning.
#
# Why it does not open the bump PR itself:
#   It used to. That needed a repository setting that lets Actions create and
#   approve pull requests (which also lets any workflow approve a PR toward
#   main's review rule), or a personal access token. It also saved little: a
#   bump must pass `make e2e` against the new runsc on a local kind cluster
#   before it merges, so a person runs the bump locally anyway. An issue
#   needs neither the setting nor a token, only `issues: write`.
# ---------------------------------------------------------------------------

name: gVisor drift

on:
  schedule:
    # Mondays 06:17 UTC. Off the hour to avoid the top-of-hour runner queue;
    # Monday so a new drift issue is waiting at the start of the week.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Open, update, label, and close the drift issue. The token still cannot
  # push, open a pull request, or approve one.
  issues: write

# A manual dispatch during the scheduled run could otherwise see "no open
# issue" twice and open two.
concurrency:
  group: gvisor-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Compare pin with newest published release
    runs-on: ubuntu-latest
    env:
      # gh reads these; the runner image ships the GitHub CLI.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRIFT_LABEL: gvisor-drift
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Exit 2 means "behind"; the script also writes gvisor_pin,
      # gvisor_latest, and gvisor_behind to $GITHUB_OUTPUT before exiting.
      # continue-on-error lets the next steps tell drift apart from a real
      # error.
      - name: Check the pin against the newest published release
        id: check
        continue-on-error: true
        env:
          # Authenticated GitHub API calls: the anonymous limit is 60/hour
          # per IP and shared runners exhaust it.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-gvisor-version.sh --latest

      # A failure that is not drift (network error, diverged pins, missing
      # artifact for the current pin) must fail the job with its own message.
      - name: Fail on a real error
        if: steps.check.outcome == 'failure' && steps.check.outputs.gvisor_behind != 'true'
        run: |
          echo "::error::scripts/check-gvisor-version.sh failed for a reason other than drift; see the step log above"
          exit 1

      # Pin current: close the drift issue if one is still open (the bump PR
      # may already have closed it).
      - name: Report and close the drift issue
        if: steps.check.outcome == 'success'
        env:
          PIN: ${{ steps.check.outputs.gvisor_pin }}
        run: |
          echo "pin ${PIN} is the newest published release; nothing to do."
          # A label filter, not a search: the search index can lag behind a
          # new issue.
          number="$(gh issue list --state open --label "$DRIFT_LABEL" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --comment "The pin is now \`${PIN}\`, the newest published release. Closed by the weekly drift check: ${RUN_URL}"
          fi

      # Pin behind: open the drift issue, or update it when a newer release
      # has shipped since it was opened. The run stays green.
      - name: Open or update the drift issue
        if: steps.check.outputs.gvisor_behind == 'true'
        env:
          PIN: ${{ steps.check.outputs.gvisor_pin }}
          LATEST: ${{ steps.check.outputs.gvisor_latest }}
          OWNER: ${{ github.repository_owner }}
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/gvisor-version.md#bumping-by-hand
        run: |
          title="gVisor ${LATEST} is published; the pin is ${PIN}"
          body="$RUNNER_TEMP/drift-issue.md"
          cat >"$body" <<MD
          The pinned gVisor release is \`${PIN}\`. The newest published release is \`${LATEST}\`.

          Release notes: https://github.com/google/gvisor/releases/tag/release-${LATEST}

          Bump by hand (see [docs/gvisor-version.md](${DOC_URL})):

          \`\`\`bash
          git fetch origin
          git switch -c chore/gvisor-${LATEST} origin/main
          ./scripts/bump-gvisor-version.sh ${LATEST}
          make kind-down && make e2e
          git commit -am "chore(gvisor): bump pinned release to ${LATEST}"
          \`\`\`

          Then open a PR that closes this issue, and consider a Packer AMI rebuild. Check the release notes for new nvproxy card families (\`NvproxySupportedProducts\` in \`pkg/preflight/gpu.go\`).

          The weekly drift check updates this issue when a newer release ships and closes it when the pin is current. Last run: ${RUN_URL}
          MD

          number="$(gh issue list --state open --label "$DRIFT_LABEL" --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            # --force creates the label on the first run and is a no-op after.
            gh label create "$DRIFT_LABEL" --force --color D93F0B \
              --description "The pinned gVisor release is behind the newest published release"
            url="$(gh issue create --title "$title" --body-file "$body" --label "$DRIFT_LABEL" --assignee "$OWNER")"
            echo "opened ${url}"
          else
            url="$(gh issue view "$number" --json url --jq .url)"
            # Same title means same pin and same newest release: the issue is
            # already right, and a comment every week would only be noise.
            if [[ "$(gh issue view "$number" --json title --jq .title)" != "$title" ]]; then
              gh issue edit "$number" --title "$title" --body-file "$body"
              gh issue comment "$number" --body "gVisor \`${LATEST}\` is now the newest published release. The issue body has the updated commands. Run: ${RUN_URL}"
              echo "updated ${url}"
            else
              echo "already open: ${url}"
            fi
          fi

          echo "::warning::gVisor pin ${PIN} is behind the newest published release ${LATEST}; bump steps in ${url}"
          printf '## gVisor %s is published; the pin is %s\n\nBump steps: %s\n' "$LATEST" "$PIN" "$url" >>"$GITHUB_STEP_SUMMARY"
