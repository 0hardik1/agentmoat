# ---------------------------------------------------------------------------
# agentmoat: golangci-lint configuration
# ---------------------------------------------------------------------------
#
# Consumed by golangci-lint v2 (the schema below uses the `version: "2"`
# config format introduced in golangci-lint v2.0). Single source of truth
# for what "lint clean" means in this repo: `make lint` runs the same
# command as CI.
#
# Philosophy:
#   * Enable the linters that catch real bugs and the ones that enforce a
#     consistent code style in a Go-ecosystem project. Each enabled linter
#     is documented inline so readers do not have to cross-reference the
#     golangci-lint docs to know what it does.
#   * Disable noisy, opinionated linters whose cost outweighs their benefit
#     here (e.g. requiring a godoc comment on every exported symbol). They
#     can be re-enabled later if the project's needs change.
#   * Exclude `test/testdata/` because that tree is fixture data, not
#     production code. Linting fixtures produces false positives and slows
#     down CI for no benefit.
# ---------------------------------------------------------------------------

version: "2"

run:
  # Generous timeout: cold caches in CI plus a growing codebase can push past
  # the default 1m. 5m is comfortably above what we observe in practice.
  timeout: 5m
  # Tests are first-class code in this repo (the e2e suite is large), so we
  # lint them too.
  tests: true

output:
  # text output prints one finding per line and is colorized when stdout is
  # a TTY. We surface the linter name and the offending source line so the
  # fix-rebuild-lint loop is as tight as possible.
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true

linters:
  # `default: none` is the v2 equivalent of v1's `disable-all: true`. We
  # explicitly enumerate every linter we run so the surface is deterministic
  # across golangci-lint upgrades.
  default: none
  enable:
    # govet: the official Go vet checks (printf format strings, struct tag
    # syntax, atomic alignment, lostcancel, etc). High signal, low noise.
    - govet
    # errcheck: flags unchecked error returns. Critical for a tool that
    # mutates a Kubernetes cluster: silently swallowed errors hide bugs.
    - errcheck
    # staticcheck: SA-series checks for real bugs (nil derefs, unreachable
    # code, dead writes). The strongest single static analyzer for Go.
    - staticcheck
    # gocyclo: flags overly complex functions. min-complexity 15 is
    # permissive enough that normal switch-heavy K8s code passes, but
    # catches genuine spaghetti before it spreads.
    - gocyclo
    # gosec: security-focused checks. Particularly relevant for a tool that
    # handles kubeconfigs, runs shell commands, and exposes an MCP surface.
    - gosec
    # revive: a fast, configurable golint replacement. Catches naming and
    # style issues that gofmt cannot (e.g. var-naming, exported comments).
    - revive
    # ineffassign: flags assignments whose value is never used. Cheap to
    # run, often the first hint of a copy-paste bug.
    - ineffassign
    # misspell: catches common English misspellings in identifiers and
    # comments. Useful in a tool whose CLI strings are read by operators.
    - misspell
    # unconvert: removes redundant type conversions. Small code-hygiene win.
    - unconvert
    # unused: detects unused constants, variables, functions, and types.
    # Helps keep dead code from accumulating during refactors.
    - unused
  settings:
    gocyclo:
      # 15 is the project's complexity budget. Functions above this should be
      # split. The number is a deliberate stricter-than-default (default 30)
      # value: a v1 CLI should not have any 30-branch functions.
      min-complexity: 15
    gosec:
      # Excludes for findings that are too noisy in early-stage scaffolding.
      # Add back once the relevant code paths are real.
      excludes:
        # G104 ("Errors unhandled"): errcheck already covers this with
        # better context-aware reporting, so we disable the gosec duplicate.
        - G104
    revive:
      # Keep revive at default rules for now. We tune severity per-rule in
      # later phases once we have more code to set policy on.
      severity: warning
    misspell:
      # US English is the project's documented spelling convention.
      locale: US
  exclusions:
    # In v2 the legacy "we know better" excludes are opt-in via the
    # `default` preset. We leave the preset list empty (same as v1's
    # `exclude-use-default: false`) so the lint surface stays honest.
    paths:
      # Fixture data, not code we ship; linting it is noise.
      - test/testdata

formatters:
  # In v2 the formatting linters live in their own block (formatters run
  # before linters so style noise does not mask real findings).
  enable:
    # gofmt: enforces canonical formatting. `gofmt -s` also catches
    # simplifications (e.g. `interface{}` to `any`).
    - gofmt
    # goimports: formats imports into the standard three groups (stdlib,
    # third-party, this module) and removes unused imports.
    - goimports

issues:
  # Increase the default-low caps so all findings show up in CI rather than
  # being hidden behind "showing first N of M".
  max-issues-per-linter: 0
  max-same-issues: 0
