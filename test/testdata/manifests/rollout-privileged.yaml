# agentmoat: expected verdict = incompatible (privileged).
# An Argo Rollout is not one of the six kinds the cluster scan lists, but it
# carries a pod template at spec.template. A file scan classifies it from
# that template and reports its kind as "Rollout.argoproj.io".
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary
  namespace: edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      containers:
        - name: canary
          image: example.test/canary:1.0
          securityContext:
            privileged: true
  strategy:
    canary:
      steps:
        - setWeight: 20
