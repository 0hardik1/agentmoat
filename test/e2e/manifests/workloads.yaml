# agentmoat: e2e workloads.
#
# Mix chosen to exercise both the happy path (a compatible Deployment that
# the planner includes and the applier patches) and the exit-code-2 path
# (an incompatible Pod that the scanner flags but the planner excludes).
#
# Workloads:
#
#   web        Deployment, compatible. Should appear in the plan with
#              action=set-runtime-class. The applier patches
#              spec.template.spec.runtimeClassName=gvisor.
#
#   cache      StatefulSet, compatible. Same as `web`, second plan step.
#              Two steps prove the per-step renderer/idempotency loops.
#
#   host-net   Pod, hostNetwork=true. Classifier flags this incompatible.
#              The planner excludes it from steps; the scanner's exit
#              code becomes 2.
#
# All workloads land in whatever namespace `kubectl apply -n ...` puts
# them in (scripts/e2e.sh uses `agentmoat-e2e`). They are deliberately
# tiny so the cluster reaches Ready in seconds.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: cache
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: host-net
  labels:
    app: host-net
spec:
  hostNetwork: true
  # hostNetwork pods must use ClusterFirstWithHostNet to resolve cluster DNS;
  # not strictly needed for this sleep-only pod, but keeps the manifest
  # representative of a real host-network workload.
  dnsPolicy: ClusterFirstWithHostNet
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
