# agentmoat: e2e workloads.
#
# Mix chosen to mirror a realistic namespace: most workloads are gVisor-
# compatible, a handful need review, and only a few are hard blockers.
# Representative rule-coverage pods are kept for the scan/explain path;
# the rest of the rules are covered in unit tests and testdata fixtures.
# The planner includes only compatible workloads as steps; incompatible
# and review verdicts are excluded by default.
#
# Workloads (alphabetical within each bucket):
#
#   Compatible (planner includes; applier patches runtimeClassName=gvisor):
#
#     analytics        Deployment, busybox (vanilla).
#     api              Deployment, nginx (info: network-throughput).
#     auth             Deployment, busybox (vanilla).
#     billing          Deployment, memcached (info: syscall-heavy).
#     cache            StatefulSet, redis (info: syscall-heavy).
#     notifications    Deployment, nginx (info: network-throughput).
#     web              Deployment, nginx (info: network-throughput).
#     worker           Deployment, busybox (vanilla).
#
#   Incompatible (planner excludes; scanner exit code becomes 2):
#
#     ebpf-app         Image hint cilium/cilium (rule: ebpf). Tag is
#                      intentionally non-pullable; the pod stays in
#                      ImagePullBackOff and the scanner reads the spec.
#     host-net         hostNetwork=true (rule: host-network).
#     priv-app         privileged=true (rule: privileged).
#
#   Review (planner excludes unless --include-review; e2e does not pass it):
#
#     fuse-app         Env AGENTMOAT_USES_FUSE=true escape hatch (rule:
#                      fuse-mount).
#     gpu-app          nvidia.com/gpu resource request (rule:
#                      gpu-passthrough). Stays Pending on kind; fine.
#     hostpath-app     hostPath /var/log mount (rule: host-path-mount).
#
# All compatible Deployments/StatefulSets should reach Ready. Edge-case
# pods only need to be recorded by the API server for the scanner to see
# them. They may sit in Pending / ImagePullBackOff / ContainerCreating
# depending on the kind node, and the e2e tolerates that.
#
# All workloads land in whatever namespace `kubectl apply -n ...` puts
# them in (scripts/e2e.sh uses `agentmoat-e2e`). They are deliberately
# tiny so the cluster reaches Ready in seconds.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  labels:
    app: cache
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: memcached:1.6-alpine
          ports:
            - containerPort: 11211
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app: analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - name: analytics
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: host-net
  labels:
    app: host-net
spec:
  hostNetwork: true
  # hostNetwork pods must use ClusterFirstWithHostNet to resolve cluster DNS;
  # not strictly needed for this sleep-only pod, but keeps the manifest
  # representative of a real host-network workload.
  dnsPolicy: ClusterFirstWithHostNet
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: priv-app
  labels:
    app: priv-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebpf-app
  labels:
    app: ebpf-app
spec:
  containers:
    - name: app
      # Image substring "cilium/cilium" triggers the ebpf rule
      # (pkg/classifier/builtin_rules.go matchEBPF). The tag is
      # intentionally non-pullable; pod stays in ImagePullBackOff but the
      # API server records the spec, which is all the scanner needs.
      image: cilium/cilium:e2e-placeholder
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-app
  labels:
    app: hostpath-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: hostlogs
          mountPath: /host/var/log
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: hostlogs
      hostPath:
        path: /var/log
        type: Directory
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-app
  labels:
    app: gpu-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          nvidia.com/gpu: "1"
        limits:
          cpu: 50m
          memory: 32Mi
          nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: fuse-app
  labels:
    app: fuse-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      env:
        # Env-var escape hatch picked up by matchFUSEMount; simpler than
        # building out a real FUSE CSI volume just for the spec match.
        - name: AGENTMOAT_USES_FUSE
          value: "true"
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
